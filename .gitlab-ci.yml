stages:
  - deploy

# v3.0：构建 VitePress 静态站点（Node 构建，产物在 docs/.vitepress/dist）
pages:
  stage: deploy
  image: node:22
  cache:
    key: npm
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run build
    - rm -rf public
    - cp -rf dist public
    - echo "Deployed VitePress site to public/"
  artifacts:
    paths:
      - public
  only:
    - main
  tags:
    - shell
